version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: falconshield-postgres
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falconpassword
      POSTGRES_DB: falconshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falconshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: falconshield-ml-service
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: falconshield-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://falcon:falconpassword@postgres:5432/falconshield_db?schema=public"
      JWT_SECRET: "falconshield_enterprise_super_secret_jwt_key_2026"
      ML_SERVICE_URL: "http://ml-service:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: falconshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
